; Advanced View Distance Framework - configuration (Phase 2 core)
;
; This build ONLY adjusts engine INI settings at runtime. It installs no rendering hooks,
; so it does not touch Bottled Shaders' reverse-Z, Hi-Z culling or shader pipeline.
; All values are MULTIPLIERS relative to the engine's own value at game start
; (1.0 = unchanged). Preset values are initial guesses and need in-game tuning.
;
; If you load into the game and see problems, set bEnabled=0 or sPreset=Low.
; First time? Set bDryRun=1 once and read the log to see what WOULD change.
; Log: Documents\My Games\Skyrim Special Edition\SKSE\AdvancedViewDistance.log
; (folder name differs for GOG / other editions)

[General]
; 1 = framework active, 0 = do nothing.
bEnabled=1
; 1 = log what would change but change nothing (use for the first test).
bDryRun=0
; 1 = verbose logging.
bDebugLogging=0
; Low (no change), Balanced, High, Ultra. See table in README.
sPreset=Balanced
; Scales every multiplier (preset or override) afterwards. 1.0 = no extra scaling.
fGlobalMultiplier=1.0

[Safety]
; Upper bound for any single multiplier after all scaling. Hard-capped at 8.0.
; Very large values risk full models fading out before the edge of loaded cells
; and heavy streaming cost. Raise slowly.
fMaxMultiplier=4.0

; ---- Optional per-setting overrides. Uncomment to REPLACE the preset value
; ---- for that setting (the global multiplier is still applied afterwards).

[Objects]
; Scales fLODFadeOutMultObjects:LOD  (distance at which static objects fade)
;fObjectFadeMult=2.0
; Scales fLODFadeOutMultItems:LOD    (small movable items / clutter)
;fItemFadeMult=1.5

[Actors]
; Scales fLODFadeOutMultActors:LOD   (NPCs and creatures; only within loaded cells)
;fActorFadeMult=1.5

[Environment]
; Scales fTreeLoadDistance:TerrainManager
;fTreeLoadDistanceMult=2.0

[LOD]
; Scales fBlockLevel0Distance:TerrainManager (highest-detail terrain LOD block range)
;fTerrainBlockLevel0Mult=2.0
; Scales fBlockLevel1Distance:TerrainManager
;fTerrainBlockLevel1Mult=2.0
